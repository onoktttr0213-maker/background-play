name: Build debug APK

on:
  push:
    branches:
      - claude/youtube-spotify-dual-playback-9y59a3
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Artifact download URLs point at Azure Blob Storage, which is not
      # reachable from every environment that needs the APK. Also publish
      # the same file to a plain git branch so it can be fetched with an
      # ordinary `git fetch` over the normal GitHub remote.
      - name: Publish APK to apk-build-output branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-build-output-tmp
          git rm -rf . > /dev/null
          cp /tmp/app-debug.apk app-debug.apk
          git add app-debug.apk
          git commit -m "Build app-debug.apk from ${{ github.sha }}"
          git push -f origin apk-build-output-tmp:apk-build-output
